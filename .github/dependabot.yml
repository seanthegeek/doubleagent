# Weekly update pull requests for the documentation site's Python
# dependencies (requirements-docs.txt), the Go modules the binary
# links (go.mod, with their copies under vendor/, which Dependabot keeps in
# step for Go) and the actions the workflows use. Dependabot reads this file
# on the default branch and checks that branch's manifests. Security alerts
# are checked separately by .githooks/pre-commit.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
