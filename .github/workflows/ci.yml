name: CI

on:
  push:
    branches: [main, go-rewrite]
  pull_request:

# Every job only checks out the repository and downloads public release
# binaries, so the token needs no more than read access to the contents.
permissions:
  contents: read

# A new push to a branch cancels the run still going for its previous commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Linter versions for the lint job. AGENTS.md ("Quality gates") and
# .githooks/pre-commit list the same versions; change all three together.
env:
  RUFF_VERSION: "0.16.10"
  PYRIGHT_VERSION: "1.1.414"
  MARKDOWNLINT_CLI2_VERSION: "0.23.3"
  SHELLCHECK_VERSION: "0.11.0"
  SHFMT_VERSION: "3.14.1"
  CHECKBASHISMS_TAG: "v2.26.13"
  STATICCHECK_VERSION: "0.8.2"
  GOVULNCHECK_VERSION: "1.9.0"

jobs:
  # Each job runs only when a file it reads changed: .github/classify-changes.sh
  # maps the changed paths to the categories below, and AGENTS.md ("Validation
  # and testing") gives the rule. A pull request is diffed from its merge base;
  # a push to main, a push whose "before" commit is unknown (a new branch, a
  # force push), a change to the workflow or the classifier, and a path no
  # category names run everything. The Markdown, document, drift and code
  # style steps of lint run on every change, since they read every part.
  # A pull request stacked on another branch merges into that branch, not
  # main, and its commits are stranded there once the lower pull request
  # has merged; only a pull request against main can reach main.
  base-branch:
    name: Base branch is main
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Fail when the base branch is not main
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$BASE_REF" != main ]; then
            printf 'pull request base is %s, not main: retarget it with gh pr edit --base main\n' "$BASE_REF"
            exit 1
          fi

  changes:
    name: Classify the change
    runs-on: ubuntu-latest
    outputs:
      sh: ${{ steps.classify.outputs.sh }}
      sh-lint: ${{ steps.classify.outputs.sh-lint }}
      powershell: ${{ steps.classify.outputs.powershell }}
      python: ${{ steps.classify.outputs.python }}
      catalog: ${{ steps.classify.outputs.catalog }}
      fork-budget: ${{ steps.classify.outputs.fork-budget }}
      go: ${{ steps.classify.outputs.go }}
      all: ${{ steps.classify.outputs.all }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Classify
        id: classify
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          scope=all
          changed=""
          if [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ]; then
            scope=all
          elif [ -n "$BASE" ] && ! printf '%s' "$BASE" | grep -q '^0*$' && git cat-file -e "$BASE" 2>/dev/null; then
            scope=diff
            changed=$(git diff --name-only "$(git merge-base "$BASE" "$GITHUB_SHA")" "$GITHUB_SHA")
          fi
          if [ "$scope" = all ]; then
            categories=$(sh .github/classify-changes.sh all < /dev/null)
          else
            categories=$(printf '%s\n' "$changed" | sh .github/classify-changes.sh)
          fi
          printf '%s\n' "$categories" >> "$GITHUB_OUTPUT"
          printf '%s\nchanged files:\n%s\n' "$categories" "$changed"

  # Compares the tables of both collectors and the analyzer's copy.
  catalog-sync:
    name: Catalog tables in sync (sh, PowerShell, analyzer copy)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.catalog == 'true'
    steps:
      - uses: actions/checkout@v7
      - name: Drift test
        run: collectors/tests/catalog-sync.sh
      - name: Regenerated copy matches the committed one
        run: |
          collectors/collect-agent-artifacts.sh --list > /tmp/catalog.txt
          if ! cmp -s /tmp/catalog.txt analyzer/doubleagent/catalog.txt; then
            echo "analyzer/doubleagent/catalog.txt is stale. Run:"
            echo "  collectors/collect-agent-artifacts.sh --list > analyzer/doubleagent/catalog.txt"
            diff /tmp/catalog.txt analyzer/doubleagent/catalog.txt || true
            exit 1
          fi

  # One job per shell so the smoke runs, several minutes each, run in
  # parallel. `shell` is the argument to smoke.sh; `wrapper` is the body of
  # a wrapper script for shells that need flags or a multi-call binary.
  analyzer:
    name: Analyzer tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.python == 'true' || needs.changes.outputs.catalog == 'true'
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install analyzer dependencies
        run: pip install -r analyzer/requirements-dev.txt
      - name: pytest
        run: analyzer/tests/run.sh
      # Branch coverage of the parser lines the change touched, on one Python
      # version, since the suite runs again under coverage.py. The checkout is
      # shallow, so the history down to the merge base and the base branch
      # are fetched first; a checkout with full history skips the unshallow.
      - name: branch coverage of the changed parser lines
        if: matrix.python == '3.14'
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then git fetch --no-tags --unshallow origin; fi
          git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          python3 tools/check_branch_coverage.py --base "origin/$BASE_REF"
      # The drift checkers' tests; tools/tests/conftest.py puts tools/ on
      # the import path, so they run from the repository root.
      - name: pytest (drift checkers)
        run: python3 -m pytest tools/tests -q
      # The round pipeline's host-side tools; lab/round/tests/conftest.py
      # puts lab/round/ on the import path.
      - name: pytest (round pipeline)
        run: python3 -m pytest lab/round/tests -q

  # The Go binary's gates, tests and release build, on the two runners whose
  # tools the parity harness will need (dash, BSD and GNU userlands). The
  # linters are pinned in the env block and run with `go run module@version`,
  # so go.mod and vendor/ hold only what the binary links. The build script
  # runs twice and the hashes must agree: a release build is reproducible or
  # it does not ship.
  go:
    name: Go (gates, tests, six-target build on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.go == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then printf 'gofmt: %s\n' "$unformatted"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: go run "honnef.co/go/tools/cmd/staticcheck@v$STATICCHECK_VERSION" ./...
      - name: govulncheck
        run: go run "golang.org/x/vuln/cmd/govulncheck@v$GOVULNCHECK_VERSION" ./...
      - name: go test
        run: go test -race ./...
      # The glob package's tests under the parity tag compare it with dash,
      # which both runners ship; Debian's dash and Apple's differ in origin.
      - name: go test (dash oracle)
        run: go test -race -tags parity ./internal/glob/
      - name: Build the six targets twice and compare the hashes
        run: |
          sh .github/go-build.sh "$RUNNER_TEMP/build-1" > "$RUNNER_TEMP/sums-1"
          sh .github/go-build.sh "$RUNNER_TEMP/build-2" > "$RUNNER_TEMP/sums-2"
          cat "$RUNNER_TEMP/sums-1"
          cmp "$RUNNER_TEMP/sums-1" "$RUNNER_TEMP/sums-2"

  lint:
    name: Lint (ruff, pyright, markdownlint, sh linters)
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - uses: actions/checkout@v7
      # The analyzer's dependencies are installed on every change: a research
      # document edit alone can create drift, and the fixture schema checker
      # imports the analyzer's test fixtures.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install analyzer dependencies
        run: pip install -r analyzer/requirements.txt
      # Each linter below runs when a file of its language changed.
      - name: Install Python linters
        if: needs.changes.outputs.python == 'true'
        run: pip install "ruff==$RUFF_VERSION" "pyright==$PYRIGHT_VERSION"
      - name: ruff check
        if: needs.changes.outputs.python == 'true'
        run: ruff check .
      - name: ruff format --check
        if: needs.changes.outputs.python == 'true'
        run: ruff format --check .
      - name: pyright (Python 3.11)
        if: needs.changes.outputs.python == 'true'
        run: pyright
      - name: markdownlint
        run: npx -y "markdownlint-cli2@$MARKDOWNLINT_CLI2_VERSION" "**/*.md"
      - name: document links
        run: python3 tools/check_doc_links.py
      - name: research document structure
        run: python3 tools/check_research_structure.py
      # The drift checkers compare the research documents with the tables,
      # the smoke tests, the parsers and the fixtures, each against its
      # baseline under tools/drift-baseline/; the structure step above also
      # runs the baselined convention rules.
      - name: drift, tables against research
        run: python3 tools/check_tables_research.py
      - name: drift, smoke test coverage
        run: python3 tools/check_smoke_coverage.py
      - name: drift, parsers against research
        run: python3 tools/check_parser_research.py
      - name: drift, fixtures against research
        run: python tools/check_fixture_schema.py
      - name: code style
        run: python3 tools/check_code_style.py
      - name: Install sh linters
        if: needs.changes.outputs.sh-lint == 'true'
        run: |
          mkdir -p "$HOME/bin"
          curl -sfL "https://github.com/koalaman/shellcheck/releases/download/v$SHELLCHECK_VERSION/shellcheck-v$SHELLCHECK_VERSION.linux.x86_64.tar.xz" | tar xJ -C /tmp
          install /tmp/shellcheck-v$SHELLCHECK_VERSION/shellcheck "$HOME/bin/shellcheck"
          curl -sfL -o "$HOME/bin/shfmt" "https://github.com/mvdan/sh/releases/download/v$SHFMT_VERSION/shfmt_v${SHFMT_VERSION}_linux_amd64"
          curl -sfL -o "$HOME/bin/checkbashisms" "https://salsa.debian.org/debian/devscripts/-/raw/$CHECKBASHISMS_TAG/scripts/checkbashisms.pl"
          printf '%s  %s\n' \
            4da528ddb3a4d1b7b24a59d4e16eb2f5fd960f4bd9a3708a15baddbdf1d5a55b "$HOME/bin/shellcheck" \
            76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf "$HOME/bin/shfmt" \
            7ffec5f4f3282d7551b7f1dd103d84ea6034bb1f177efdce2cebc60bfd72c088 "$HOME/bin/checkbashisms" | sha256sum -c -
          chmod +x "$HOME/bin/shfmt" "$HOME/bin/checkbashisms"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: shfmt POSIX parse (no reformatting)
        if: needs.changes.outputs.sh-lint == 'true'
        run: shfmt -ln posix $(shfmt -f . | grep -v '^vendor/') > /dev/null
      - name: shellcheck (all sh files, .shellcheckrc)
        if: needs.changes.outputs.sh-lint == 'true'
        run: shellcheck -s sh $(shfmt -f . | grep -v '^vendor/')
      - name: checkbashisms
        if: needs.changes.outputs.sh-lint == 'true'
        run: checkbashisms -p $(shfmt -f . | grep -v '^vendor/')

  # The one status check the ruleset on main requires. A matrix job that
  # the classification skips reports under its unexpanded name ("Analyzer
  # tests", not "Analyzer tests (3.11)"), so a pull request that skips
  # it can never satisfy a list of per-job required checks. This job
  # depends on every other job, runs whatever they did, and fails when any
  # of them failed or was cancelled; a skipped job counts as passed.
  site:
    name: Site build (strict)
    runs-on: ubuntu-latest
    needs: changes
    # The site is built strict on every change, as the Pages workflow builds
    # it after a merge, so a page missing from the nav tree or a broken site
    # link fails the pull request instead of the publish. Its own job, on the
    # Python the Pages workflow uses: the lint job runs on the analyzer's
    # minimum Python, which the theme may stop supporting first.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      - name: mkdocs build --strict
        run: mkdocs build --strict -f mkdocs/mkdocs.yml -d "$RUNNER_TEMP/site"

  result:
    name: CI result
    runs-on: ubuntu-latest
    if: always()
    needs:
      - base-branch
      - changes
      - catalog-sync
      - analyzer
      - go
      - lint
      - site
    steps:
      - name: Fail when any job failed or was cancelled
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$RESULTS"
          if printf '%s' "$RESULTS" | grep -Eq '"result": *"(failure|cancelled)"'; then
            exit 1
          fi
