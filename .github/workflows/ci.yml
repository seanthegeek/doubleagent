name: CI

# A milestone integration branch of the Go rewrite (go-rewrite-*) and a
# unit branch (unit-*) run CI too, so a unit's first run on the Windows
# runner precedes its merge.
on:
  push:
    branches: [main, go-rewrite, 'go-rewrite-*', 'unit-*']
  pull_request:

# Every job only checks out the repository and downloads public release
# binaries, so the token needs no more than read access to the contents.
permissions:
  contents: read

# A new push to a pull request or to a unit branch (one piece of work on its
# way to an integration branch) cancels the run still going for its previous
# commit. On main and the integration branches a run in progress finishes, so
# every head that is built on gets a verdict; a newer push waits behind it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || startsWith(github.ref_name, 'unit-') }}

# Linter versions for the lint and go jobs. AGENTS.md ("Quality gates") lists
# the same versions, and the Makefile pins the staticcheck and govulncheck
# ones; change them together.
env:
  RUFF_VERSION: "0.16.10"
  PYRIGHT_VERSION: "1.1.414"
  MARKDOWNLINT_CLI2_VERSION: "0.23.3"
  SHELLCHECK_VERSION: "0.11.0"
  SHFMT_VERSION: "3.14.1"
  CHECKBASHISMS_TAG: "v2.26.13"
  STATICCHECK_VERSION: "0.8.2"
  GOVULNCHECK_VERSION: "1.9.0"
  # Every go command builds the zstd module without assembly or unchecked
  # memory reads (internal/zstdframe does not compile without these tags). A
  # command that sets -tags itself replaces this, so it spells all three.
  GOFLAGS: "-tags=noasm,nounsafe"

jobs:
  # Each job runs only when a file it reads changed: .github/classify-changes.sh
  # maps the changed paths to the categories below, and AGENTS.md ("Validation
  # and testing") gives the rule. A pull request is diffed from its merge base;
  # a push to main, a push whose "before" commit is unknown (a new branch, a
  # force push), a change to the workflow or the classifier, and a path no
  # category names run everything. The Markdown, document, drift and code
  # style steps of lint run on every change, since they read every part.
  # A pull request stacked on another branch merges into that branch, not
  # main, and its commits are stranded there once the lower pull request
  # has merged; only a pull request against main can reach main.
  base-branch:
    name: Base branch is main
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Fail when the base branch is not main
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$BASE_REF" != main ]; then
            printf 'pull request base is %s, not main: retarget it with gh pr edit --base main\n' "$BASE_REF"
            exit 1
          fi

  changes:
    name: Classify the change
    runs-on: ubuntu-latest
    outputs:
      sh-lint: ${{ steps.classify.outputs.sh-lint }}
      python: ${{ steps.classify.outputs.python }}
      go: ${{ steps.classify.outputs.go }}
      all: ${{ steps.classify.outputs.all }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Classify
        id: classify
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          scope=all
          changed=""
          if [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ]; then
            scope=all
          elif [ -n "$BASE" ] && ! printf '%s' "$BASE" | grep -q '^0*$' && git cat-file -e "$BASE" 2>/dev/null; then
            scope=diff
            changed=$(git diff --name-only "$(git merge-base "$BASE" "$GITHUB_SHA")" "$GITHUB_SHA")
          fi
          if [ "$scope" = all ]; then
            categories=$(sh .github/classify-changes.sh all < /dev/null)
          else
            categories=$(printf '%s\n' "$changed" | sh .github/classify-changes.sh)
          fi
          printf '%s\n' "$categories" >> "$GITHUB_OUTPUT"
          printf '%s\nchanged files:\n%s\n' "$categories" "$changed"

  # The Go binary's gates, tests and release build, on Linux, macOS and
  # Windows. The linters are pinned in the env block and run
  # with `go run module@version`, so go.mod and vendor/ hold only what the
  # binary links. The build script runs twice and the hashes must agree: a
  # release build is reproducible or it does not ship. Every step runs under
  # bash so the same shell lines serve the Windows runner (Git Bash).
  go:
    name: Go (gates, tests, six-target build on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.go == 'true'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # A unit branch is checked on Linux alone; its integration branch
        # and every pull request run all three platforms.
        os: ${{ fromJSON(github.event_name == 'push' && startsWith(github.ref_name, 'unit-') && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest", "windows-latest"]') }}
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then printf 'gofmt: %s\n' "$unformatted"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: go run "honnef.co/go/tools/cmd/staticcheck@v$STATICCHECK_VERSION" ./...
      - name: govulncheck
        run: go run "golang.org/x/vuln/cmd/govulncheck@v$GOVULNCHECK_VERSION" ./...
      # The race detector needs cgo on Linux; the tests are not the shipped
      # binary, which the build steps below make with CGO_ENABLED=0. The
      # slowest packages under the race detector (internal/analyze and
      # internal/parsers) take up to about five minutes on the Windows runner,
      # so each package's test timeout is set to 30 minutes, six times that,
      # in place of go test's ten-minute default. It stays below the job's
      # limit, so a package that hangs still prints its goroutines.
      - name: go test
        env:
          CGO_ENABLED: "1"
        run: go test -race -timeout 30m ./...
      # The glob package's tests under the dash tag compare it with dash,
      # which the Unix runners ship; Debian's dash and Apple's differ in origin.
      - name: go test (dash)
        if: runner.os != 'Windows'
        env:
          CGO_ENABLED: "1"
        run: go test -race -tags dash,noasm,nounsafe ./internal/glob/
      # Built without encoding/json v2, the token reader has no depth limit,
      # so only there does jsonvalue's own limit refuse a document. This runs
      # that one test in that build; the package's other tests are left out,
      # since three of them fail there for reasons unrelated to depth.
      - name: go test (JSON depth limit without encoding/json v2)
        env:
          GOEXPERIMENT: nojsonv2
        run: go test -run '^TestArraysAndObjectsNestAtMostTenThousandDeep$' ./internal/jsonvalue/
      - name: Build the six targets twice and compare the hashes
        run: |
          sh .github/go-build.sh "$RUNNER_TEMP/build-1" > "$RUNNER_TEMP/sums-1"
          sh .github/go-build.sh "$RUNNER_TEMP/build-2" > "$RUNNER_TEMP/sums-2"
          cat "$RUNNER_TEMP/sums-1"
          cmp "$RUNNER_TEMP/sums-1" "$RUNNER_TEMP/sums-2"

  lint:
    name: Lint (ruff, pyright, Python tests, markdownlint, sh linters)
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - uses: actions/checkout@v7
      # The oldest Python the checkers and the round pipeline's tools support.
      # The checkers below need only the standard library; pytest runs the
      # tests of the checkers and of the round pipeline, and pyright resolves
      # the pytest import of a checker's test.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # Each linter below runs when a file of its language changed.
      - name: Install Python linters and pytest
        if: needs.changes.outputs.python == 'true'
        run: pip install "ruff==$RUFF_VERSION" "pyright==$PYRIGHT_VERSION" pytest
      - name: ruff check
        if: needs.changes.outputs.python == 'true'
        run: ruff check .
      - name: ruff format --check
        if: needs.changes.outputs.python == 'true'
        run: ruff format --check .
      - name: pyright (Python 3.11)
        if: needs.changes.outputs.python == 'true'
        run: pyright
      # The drift checkers' tests; tools/tests/conftest.py puts tools/ on the
      # import path, so they run from the repository root.
      - name: pytest (drift checkers)
        if: needs.changes.outputs.python == 'true'
        run: python3 -m pytest tools/tests -q
      # The round pipeline's host-side tools; lab/tests/conftest.py
      # puts lab/ on the import path.
      - name: pytest (round pipeline)
        if: needs.changes.outputs.python == 'true'
        run: python3 -m pytest lab/tests -q
      - name: markdownlint
        run: npx -y "markdownlint-cli2@$MARKDOWNLINT_CLI2_VERSION" "**/*.md"
      - name: document links
        run: python3 tools/check_doc_links.py
      - name: research document structure
        run: python3 tools/check_research_structure.py
      # The drift checker compares the research documents with the tables,
      # against its baseline under
      # tools/drift-baseline/; the structure step above also runs the
      # baselined convention rules.
      - name: drift, tables against research
        run: python3 tools/check_tables_research.py
      - name: code style
        run: python3 tools/check_code_style.py
      - name: Install sh linters
        if: needs.changes.outputs.sh-lint == 'true'
        run: |
          mkdir -p "$HOME/bin"
          curl -sfL "https://github.com/koalaman/shellcheck/releases/download/v$SHELLCHECK_VERSION/shellcheck-v$SHELLCHECK_VERSION.linux.x86_64.tar.xz" | tar xJ -C /tmp
          install /tmp/shellcheck-v$SHELLCHECK_VERSION/shellcheck "$HOME/bin/shellcheck"
          curl -sfL -o "$HOME/bin/shfmt" "https://github.com/mvdan/sh/releases/download/v$SHFMT_VERSION/shfmt_v${SHFMT_VERSION}_linux_amd64"
          curl -sfL -o "$HOME/bin/checkbashisms" "https://salsa.debian.org/debian/devscripts/-/raw/$CHECKBASHISMS_TAG/scripts/checkbashisms.pl"
          printf '%s  %s\n' \
            4da528ddb3a4d1b7b24a59d4e16eb2f5fd960f4bd9a3708a15baddbdf1d5a55b "$HOME/bin/shellcheck" \
            76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf "$HOME/bin/shfmt" \
            7ffec5f4f3282d7551b7f1dd103d84ea6034bb1f177efdce2cebc60bfd72c088 "$HOME/bin/checkbashisms" | sha256sum -c -
          chmod +x "$HOME/bin/shfmt" "$HOME/bin/checkbashisms"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: shfmt POSIX parse (no reformatting)
        if: needs.changes.outputs.sh-lint == 'true'
        run: shfmt -ln posix $(shfmt -f . | grep -v '^vendor/') > /dev/null
      - name: shellcheck (all sh files, .shellcheckrc)
        if: needs.changes.outputs.sh-lint == 'true'
        run: shellcheck -s sh $(shfmt -f . | grep -v '^vendor/')
      - name: checkbashisms
        if: needs.changes.outputs.sh-lint == 'true'
        run: checkbashisms -p $(shfmt -f . | grep -v '^vendor/')

  # The one status check the ruleset on main requires. A matrix job that
  # the classification skips reports under its unexpanded name, not once
  # per runner, so a pull request that skips it can never satisfy a list of
  # per-job required checks. This job
  # depends on every other job, runs whatever they did, and fails when any
  # of them failed or was cancelled; a skipped job counts as passed.
  site:
    name: Site build (strict)
    runs-on: ubuntu-latest
    needs: changes
    # The site is built strict on every change, as the Pages workflow builds
    # it after a merge, so a page missing from the nav tree or a broken site
    # link fails the pull request instead of the publish. Its own job, on the
    # Python the Pages workflow uses: the lint job runs on the checkers'
    # minimum Python, which the theme may stop supporting first.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      - name: mkdocs build --strict
        run: mkdocs build --strict -f mkdocs/mkdocs.yml -d "$RUNNER_TEMP/site"

  result:
    name: CI result
    runs-on: ubuntu-latest
    if: always()
    needs:
      - base-branch
      - changes
      - go
      - lint
      - site
    steps:
      - name: Fail when any job failed or was cancelled
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$RESULTS"
          if printf '%s' "$RESULTS" | grep -Eq '"result": *"(failure|cancelled)"'; then
            exit 1
          fi
