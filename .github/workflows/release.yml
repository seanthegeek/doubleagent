# Builds a release of doubleagent when a version tag is pushed, and saves it
# as a draft GitHub Release that the maintainer reads and publishes by hand.
#
# The six binaries are built from the tag on two different runner images and
# must come out byte for byte the same: the build is reproducible, and a
# release proves it. The draft carries the binaries, SHA256SUMS (the form
# `sha256sum -c` reads), LICENSE and THIRD_PARTY_NOTICES.txt, and its notes
# are the version's section of CHANGELOG.md. Each binary also gets a
# signed build provenance attestation, which `gh attestation verify` checks.
#
# A pushed tag must name a commit on main and have no release yet, draft or
# published. A run started by hand (workflow_dispatch) is a dry run: it
# builds, compares and checks everything for the version given, from the
# branch it is started on, and creates no release and no attestation.
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to dry-run, without the v (such as 0.1.0); nothing is published
        required: true
        type: string

# Every job reads the repository; the one job that writes asks for more.
permissions:
  contents: read

# One run per tag; a second push of the same tag waits for the first.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # The version from the tag without its v, or the version a dry run names.
  VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}

jobs:
  # A release is made only of a commit on main, the branch every change
  # reaches through a reviewed pull request; a tag on any other commit
  # stops the run before anything is built.
  origin:
    name: Check that the tagged commit is on main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Fail unless main holds the tagged commit
        if: github.event_name == 'push'
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME names $GITHUB_SHA, which main does not hold"
            exit 1
          fi

  build:
    name: Build on ${{ matrix.os }}
    needs: origin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No build cache: a release is built from the source and the toolchain
      # alone, never from a cache an earlier run wrote.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build the six targets
        run: |
          VERSION=${VERSION#v}
          export VERSION
          sh .github/go-build.sh "$RUNNER_TEMP/release" > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" "$RUNNER_TEMP/release/SHA256SUMS"
          cat "$RUNNER_TEMP/release/SHA256SUMS"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ matrix.os }}
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 7

  verify:
    name: Compare the two builds and check the release files
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-*
          path: ${{ runner.temp }}/builds
      - name: Fail unless both runners built the same bytes
        run: |
          linux="$RUNNER_TEMP/builds/build-ubuntu-latest"
          macos="$RUNNER_TEMP/builds/build-macos-latest"
          cat "$linux/SHA256SUMS"
          cmp "$linux/SHA256SUMS" "$macos/SHA256SUMS"
          test "$(wc -l < "$linux/SHA256SUMS")" -eq 6
          for file in "$linux"/doubleagent-*; do
            cmp "$file" "$macos/${file##*/}"
          done
          (cd "$linux" && sha256sum -c SHA256SUMS)
      - name: Check the version the Linux binary reports
        run: |
          VERSION=${VERSION#v}
          binary="$RUNNER_TEMP/builds/build-ubuntu-latest/doubleagent-linux-amd64"
          chmod +x "$binary"
          reported=$("$binary" --version)
          printf '%s\n' "$reported"
          test "$reported" = "doubleagent $VERSION"
      - name: Check the release notes and the licence notices
        env:
          BASE_URL: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}/
        run: |
          sh .github/release-notes.sh "${VERSION#v}" CHANGELOG.md "$BASE_URL"
          go test -tags noasm,nounsafe -run '^TestTheNotices' ./internal/version/

  publish:
    name: Attest the binaries and create the draft release
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release and upload its files
      id-token: write # the OIDC token the attestation's signing certificate is issued for
      attestations: write # store the attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A draft is visible only to a token that may write, as this job's
      # is; a release the tag already has, draft or published, stops the
      # run before a second set of attestations or a second draft is made.
      - name: Fail when the tag already has a release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if found=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName 2>&1); then
            echo "::error::$TAG already has a release; delete it before running again"
            exit 1
          fi
          case $found in
            *"release not found"*) ;;
            *)
              printf '%s\n' "$found"
              exit 1
              ;;
          esac
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-ubuntu-latest
          path: ${{ runner.temp }}/release
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/release/SHA256SUMS
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          BASE_URL: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/
        run: |
          version=${TAG#v}
          sh .github/release-notes.sh "$version" CHANGELOG.md "$BASE_URL" > "$RUNNER_TEMP/notes.md"
          set -- --draft --verify-tag --title "$version" --notes-file "$RUNNER_TEMP/notes.md"
          case $version in
            *-*) set -- "$@" --prerelease ;;
          esac
          cp LICENSE THIRD_PARTY_NOTICES.txt "$RUNNER_TEMP/release/"
          cd "$RUNNER_TEMP/release"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" "$@" \
            doubleagent-* SHA256SUMS LICENSE THIRD_PARTY_NOTICES.txt
