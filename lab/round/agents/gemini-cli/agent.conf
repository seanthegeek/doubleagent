# shellcheck shell=sh
# Gemini CLI's terminal, as round.sh waits on it. AGENT_MARKER is the
# placeholder of the empty input box, shown once a turn has ended;
# AGENT_BUSY is the hint beside the spinner while a turn runs. Both are
# grep -E patterns over the rendered screen. The numbers are defaults the
# environment may override.
AGENT_MARKER='Type your message'
AGENT_BUSY='esc to cancel'
# AGENT_OPTION is the highlighted option line of a dialog, matched once
# the box-drawing characters and the end spaces are removed.
AGENT_OPTION='^ *● '
# AGENT_INPUT_GUARD is the pattern of an input dialog with no option line,
# here the API key prompt, whose footer offers to clear the stored key; no
# prompt is typed while it or AGENT_OPTION is on the screen.
AGENT_INPUT_GUARD='clear stored key'
: "${TURN_SECONDS:=300}" "${QUIET_SECONDS:=3}" "${TERMINAL_COLS:=120}" "${TERMINAL_ROWS:=40}"
