# shellcheck shell=sh
# pi's terminal, as round.sh waits on it. pi's editor shows no placeholder
# text the research names, so the marker is empty and a step waits for the
# screen to settle for QUIET_SECONDS with the busy hint gone; a first run
# that reads the screen should name both. The numbers are defaults the
# environment may override.
AGENT_MARKER=''
AGENT_BUSY='Working'
# AGENT_LIVE_AFTER, the pattern of the lines the scrollback ends at, is
# empty: the research document names none, so the whole screen
# is read for a dialog.
AGENT_LIVE_AFTER=''
# AGENT_OPTION is the highlighted option line of a dialog, matched once
# the box-drawing characters and the end spaces are removed: pi's selectors
# mark the selected option with an arrow (pi 2c8d1feb, packages/coding-agent/
# src/modes/interactive/components/extension-selector.ts:90 and
# oauth-selector.ts:168).
AGENT_OPTION='^ *→ '
# AGENT_INPUT_GUARD is the pattern of an input dialog with no option line,
# the hint input /bug opens first (modes/interactive/bug-report.ts:111);
# no prompt is typed while it or AGENT_OPTION is on the screen.
AGENT_INPUT_GUARD='What went wrong'
: "${TURN_SECONDS:=300}" "${QUIET_SECONDS:=5}" "${TERMINAL_COLS:=120}" "${TERMINAL_ROWS:=40}"
