# shellcheck shell=sh
# Qwen Code's terminal, as round.sh waits on it. Qwen Code forked Gemini
# CLI's interface, so the input placeholder and the busy hint are taken to
# be Gemini CLI's until a first run reads the screen. grep -E patterns over
# the rendered screen; the numbers are defaults the environment may
# override.
AGENT_MARKER='Type your message'
AGENT_BUSY='esc to cancel'
# AGENT_LIVE_AFTER matches, once the box-drawing characters and the end
# spaces are removed, the lines the scrollback ends at, below the last of
# which a dialog is read; taken to be Gemini CLI's input prefixes
# until a first run reads a screen (a restart notice, if any, is not known).
AGENT_LIVE_AFTER='^[>!*] '
# AGENT_OPTION is the highlighted option line of a dialog, matched once
# the box-drawing characters and the end spaces are removed; taken to be
# Gemini CLI's until a first run reads a dialog.
AGENT_OPTION='^ *● '
# AGENT_INPUT_GUARD, the pattern of an input dialog with no option line, is
# empty: the research document names none.
AGENT_INPUT_GUARD=''
: "${TURN_SECONDS:=300}" "${QUIET_SECONDS:=3}" "${TERMINAL_COLS:=120}" "${TERMINAL_ROWS:=40}"
