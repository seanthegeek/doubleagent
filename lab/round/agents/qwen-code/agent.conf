# shellcheck shell=sh
# Qwen Code's terminal, as round.sh waits on it. Qwen Code forked Gemini
# CLI's interface, so the input placeholder and the busy hint are taken to
# be Gemini CLI's until a first run reads the screen. grep -E patterns over
# the rendered screen; the numbers are defaults the environment may
# override.
AGENT_MARKER='Type your message'
AGENT_BUSY='esc to cancel'
: "${TURN_SECONDS:=300}" "${QUIET_SECONDS:=3}" "${TERMINAL_COLS:=120}" "${TERMINAL_ROWS:=40}"
