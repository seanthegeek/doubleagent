[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "doubleagent"
dynamic = ["version"]
description = "DoubleAgent: forensic analyzer of AI agent use on a system: detects agent state and builds a JSONL timeline from the agents' transcripts"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = ["zstandard", "python-dateutil"]

[project.urls]
Homepage = "https://seanthegeek.net/doubleagent/"
Documentation = "https://seanthegeek.net/doubleagent/analyzer/README.html"
Repository = "https://github.com/seanthegeek/doubleagent"
Issues = "https://github.com/seanthegeek/doubleagent/issues"
Changelog = "https://seanthegeek.net/doubleagent/analyzer/CHANGELOG.html"

[project.scripts]
doubleagent = "doubleagent.cli:main"

[tool.hatch.version]
path = "doubleagent/__init__.py"

# The package directory holds the parsers and the bundled catalog.txt.
[tool.hatch.build.targets.wheel]
packages = ["doubleagent"]

# pytest runs the unittest classes as they are; tests/ is on the import path
# so the test modules can import the shared fixtures package by name.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

# The rule set lives in the repository root's ruff.toml so analyzer/,
# analyzer/tools/ and tools/ share it; this makes ruff run from inside
# analyzer/ pick up the same settings instead of any user-level config.
[tool.ruff]
extend = "../ruff.toml"
