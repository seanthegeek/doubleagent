# Ruff configuration for every Python file in the repository (tools/, mkdocs/,
# lab/round/ and the fixture scripts under internal/**/testdata/). A project
# config takes precedence over any user-level ruff configuration.
target-version = "py311"
line-length = 100
# Only Python files; ruff must never rewrite the code blocks in the Markdown
# research documents.
include = ["*.py", "*.pyi"]

[lint]
# E, W     pycodestyle errors and warnings.
# F        pyflakes: undefined names, unused imports and variables.
# I        isort: one import order everywhere.
# B        flake8-bugbear: mutable defaults, loop-variable closures, bare
#          except and other patterns that hide bugs.
# UP       pyupgrade, bounded by target-version so nothing newer than 3.11.
# SIM      flake8-simplify.
# RUF      ruff-specific checks (ambiguous unicode, mutable class defaults).
# BLE      flake8-blind-except: catch specific errors rather than hiding a
#          bug.
# D        pydocstyle, with the Google convention below: the docstring form
#          the "Code style" section of AGENTS.md requires.
# Not selected: S (bandit) flags every dynamic SQL string the fixture scripts
# build from fixed table and column names, and PTH
# would rewrite working os.path and os.walk calls for no bug-finding value.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "BLE", "D"]
ignore = [
    # Line length belongs to `ruff format`; what it cannot wrap is long
    # string literals (regexes, SQL, fixture records) that read better whole.
    "E501",
    # %-formatting is the house style, including regex templates such as
    # ROLLOUT_TMPL % re.escape(prefix); the rewrite to str.format is unsafe.
    "UP031",
    # try/except/pass is explicit about what a loop tolerates, and
    # contextlib.suppress would add a context manager per item for no gain in
    # clarity.
    "SIM105",
]

[lint.per-file-ignores]
# Test methods and functions are named for what they prove, so need no docstring.
"tools/tests/*.py" = ["D102", "D103", "D105", "D107"]
"lab/round/tests/*.py" = ["D102", "D103", "D105", "D107"]

[lint.pydocstyle]
convention = "google"
